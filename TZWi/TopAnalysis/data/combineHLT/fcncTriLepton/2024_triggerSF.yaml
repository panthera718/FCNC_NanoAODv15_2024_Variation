# Trigger definitions for the 2024 exact-3-lepton trigger-SF workflow.
# Put this file in:
#   $CMSSW_BASE/src/TZWi/TopAnalysis/data/combineHLT/fcncTriLepton/2024_triggerSF.yaml
#
# The Analysis set is the lepton-trigger OR to be corrected by the trigger SF.
# The Reference set must be an independent reference trigger set.  For an
# unbiased data efficiency measurement, produce data NTuples from a MET/JetMET
# primary dataset selected by the Reference set, not from EGamma/Muon/MuonEG.
#
# CombineHLT treats missing NanoAOD branches as false, so keeping a few possible
# reference paths is safe.  However, you must validate the fired/nonzero paths in
# your Run2024 NanoAODv15 files before trusting the result.

RunIIISummer24.Analysis: &Analysis "
  HLT_Ele30_WPTight_Gsf ||
  HLT_Ele32_WPTight_Gsf ||
  HLT_Ele32_WPTight_Gsf_L1DoubleEG ||
  HLT_Ele35_WPTight_Gsf ||
  HLT_Ele115_CaloIdVT_GsfTrkIdT ||
  HLT_Ele23_Ele12_CaloIdL_TrackIdL_IsoVL_DZ ||
  HLT_Ele23_Ele12_CaloIdL_TrackIdL_IsoVL ||
  HLT_DoubleEle25_CaloIdL_MW ||
  HLT_Ele16_Ele12_Ele8_CaloIdL_TrackIdL ||
  HLT_IsoMu24 ||
  HLT_IsoMu27 ||
  HLT_Mu50 ||
  HLT_Mu17_TrkIsoVVL_Mu8_TrkIsoVVL_DZ_Mass3p8 ||
  HLT_Mu17_TrkIsoVVL_Mu8_TrkIsoVVL_DZ_Mass8 ||
  HLT_TripleMu_12_10_5 ||
  HLT_TripleMu_10_5_5_DZ ||
  HLT_Mu12_TrkIsoVVL_Ele23_CaloIdL_TrackIdL_IsoVL_DZ ||
  HLT_Mu23_TrkIsoVVL_Ele12_CaloIdL_TrackIdL_IsoVL ||
  HLT_Mu23_TrkIsoVVL_Ele12_CaloIdL_TrackIdL_IsoVL_DZ ||
  HLT_Mu8_TrkIsoVVL_Ele23_CaloIdL_TrackIdL_IsoVL_DZ ||
  HLT_Mu8_DiEle12_CaloIdL_TrackIdL ||
  HLT_Mu8_DiEle12_CaloIdL_TrackIdL_DZ ||
  HLT_DiMu9_Ele9_CaloIdL_TrackIdL_DZ
"

Run2024.Analysis: *Analysis

# Independent reference trigger candidates.  Replace/trim this list after
# checking the HLT branches present in your Run2024 NanoAODv15 MET/JetMET files.
RunIIISummer24.Reference: &Reference "
  HLT_PFMET120_PFMHT120_IDTight ||
  HLT_PFMETNoMu120_PFMHTNoMu120_IDTight ||
  HLT_PFMETTypeOne120_PFMHT120_IDTight ||
  HLT_PFMETTypeOne140_PFMHT140_IDTight ||
  HLT_PFMETNoMu140_PFMHTNoMu140_IDTight ||
  HLT_PFMETNoMu120_PFMHTNoMu120_IDTight_FilterHF ||
  HLT_PFMET120_PFMHT120_IDTight_PFHT60 ||
  HLT_PFMETNoMu120_PFMHTNoMu120_IDTight_PFHT60
"

Run2024.Reference: *Reference

# Optional diagnostic groups.  The SF script below does not require them, but
# they are useful when validating which HLT category dominates each final state.
TriggerGroup.Electron: "
  HLT_Ele30_WPTight_Gsf ||
  HLT_Ele32_WPTight_Gsf ||
  HLT_Ele32_WPTight_Gsf_L1DoubleEG ||
  HLT_Ele35_WPTight_Gsf ||
  HLT_Ele115_CaloIdVT_GsfTrkIdT
"

TriggerGroup.DoubleElectron: "
  HLT_Ele23_Ele12_CaloIdL_TrackIdL_IsoVL_DZ ||
  HLT_Ele23_Ele12_CaloIdL_TrackIdL_IsoVL ||
  HLT_DoubleEle25_CaloIdL_MW
"

TriggerGroup.TripleElectron: "
  HLT_Ele16_Ele12_Ele8_CaloIdL_TrackIdL
"

TriggerGroup.Muon: "
  HLT_IsoMu24 ||
  HLT_IsoMu27 ||
  HLT_Mu50
"

TriggerGroup.DoubleMuon: "
  HLT_Mu17_TrkIsoVVL_Mu8_TrkIsoVVL_DZ_Mass3p8 ||
  HLT_Mu17_TrkIsoVVL_Mu8_TrkIsoVVL_DZ_Mass8
"

TriggerGroup.TripleMuon: "
  HLT_TripleMu_12_10_5 ||
  HLT_TripleMu_10_5_5_DZ
"

TriggerGroup.EMu: "
  HLT_Mu12_TrkIsoVVL_Ele23_CaloIdL_TrackIdL_IsoVL_DZ ||
  HLT_Mu23_TrkIsoVVL_Ele12_CaloIdL_TrackIdL_IsoVL ||
  HLT_Mu23_TrkIsoVVL_Ele12_CaloIdL_TrackIdL_IsoVL_DZ ||
  HLT_Mu8_TrkIsoVVL_Ele23_CaloIdL_TrackIdL_IsoVL_DZ
"

TriggerGroup.Mixed3L: "
  HLT_Mu8_DiEle12_CaloIdL_TrackIdL ||
  HLT_Mu8_DiEle12_CaloIdL_TrackIdL_DZ ||
  HLT_DiMu9_Ele9_CaloIdL_TrackIdL_DZ
"
