# Fill lumi_pb with the certified 2024 luminosity used by the analysis.
# Fill every sum_gen_weight with the sum of Runs.genEventSumw over the ORIGINAL
# NanoAOD files belonging to that sample. Do not use the number of events and
# do not use the number of selected SF-NTuple entries.
lumi_pb: 109000.0

selection:
  # Baseline WZ enrichment. These values are configurable and should be varied
  # for the measurement-region systematic study.
  min_probe_pt: 10.0
  min_met: 30.0
  min_w_mt: 30.0
  max_w_mt: null

  # Analysis object definitions.
  min_electron_cutbased: 3
  min_electron_tightcharge: 2
  electron_prompt_mva: 0.90
  max_muon_pf_rel_iso04: 0.40
  muon_prompt_mva: 0.70

data:
  deduplicate: true
  inputs:
    - "${LEPSF_BASE}/reco/${LEPSF_MODE}/EGamma*/*.root"
    - "${LEPSF_BASE}/reco/${LEPSF_MODE}/Muon*/*.root"
    - "${LEPSF_BASE}/reco/${LEPSF_MODE}/MuonEG*/*.root"

signal:
  name: WZto3LNu
  inputs:
    - "${LEPSF_BASE}/reco/${LEPSF_MODE}/WZto3LNu*/*.root"
  weight_branch: SF_genWeight
  xsec_pb: 5.297
  sum_gen_weight: 1221944255.2106206
  # WZ events whose selected probe is not prompt are not part of the signal
  # efficiency and are subtracted from Data as a background component.
  subtract_nonprompt_component: true

backgrounds:
  # Electron conversion / radiative DY backgrounds are essential in LepSFEl.
  - name: DYGto2LG_4to50
    inputs: ["${LEPSF_BASE}/reco/${LEPSF_MODE}/DYGto2LG-1Jets_Bin-MLL-4to50*/*.root"]
