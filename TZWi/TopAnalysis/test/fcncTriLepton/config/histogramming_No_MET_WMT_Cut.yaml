weight_list:
    weight__central: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__PUUp: "(abs(genWeight)/genWeight)*puWeightUp*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__PUDown: "(abs(genWeight)/genWeight)*puWeightDown*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__ElSFUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*(Electron_SF + Electron_SFerr)*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__ElSFDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*(Electron_SF - Electron_SFerr)*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__ElSFStatUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*(Electron_SF + Electron_SFerrStat)*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__ElSFStatDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*(Electron_SF - Electron_SFerrStat)*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__ElSFSystUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*(Electron_SF + Electron_SFerrSyst)*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__ElSFSystDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*(Electron_SF - Electron_SFerrSyst)*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__ElRecoSFUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*(Electron_RecoSF + Electron_RecoSFerr)*Electron_SF*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__ElRecoSFDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*(Electron_RecoSF - Electron_RecoSFerr)*Electron_SF*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__MuSFUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*(Muon_SF + Muon_SFerr)*BtagWeight*L1PreFiringWeight_Nom"
    weight__MuSFDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*(Muon_SF - Muon_SFerr)*BtagWeight*L1PreFiringWeight_Nom"
    weight__MuSFStatUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*(Muon_SF + Muon_SFerrStat)*BtagWeight*L1PreFiringWeight_Nom"
    weight__MuSFStatDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*(Muon_SF - Muon_SFerrStat)*BtagWeight*L1PreFiringWeight_Nom"
    weight__MuSFSystUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*(Muon_SF + Muon_SFerrSyst)*BtagWeight*L1PreFiringWeight_Nom"
    weight__MuSFSystDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*(Muon_SF - Muon_SFerrSyst)*BtagWeight*L1PreFiringWeight_Nom"
    weight__PSWeightISRUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*(PSWeight[0])*L1PreFiringWeight_Nom"
    weight__PSWeightISRDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*(PSWeight[2])*L1PreFiringWeight_Nom"
    weight__PSWeightFSRUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*(PSWeight[1])*L1PreFiringWeight_Nom"
    weight__PSWeightFSRDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*(PSWeight[3])*L1PreFiringWeight_Nom"
    weight__JetPUIDUp: "(abs(genWeight)/genWeight)*puWeight*(JetPUID_SF + JetPUID_SFerr)*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__JetPUIDDown: "(abs(genWeight)/genWeight)*puWeight*(JetPUID_SF - JetPUID_SFerr)*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*L1PreFiringWeight_Nom"
    weight__BtagLFUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_up_lf*L1PreFiringWeight_Nom"
    weight__BtagLFDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_down_lf*L1PreFiringWeight_Nom"
    weight__BtagHFUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_up_hf*L1PreFiringWeight_Nom"
    weight__BtagHFDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_down_hf*L1PreFiringWeight_Nom"
    weight__BtagHFStats1Up: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_up_hfstats1*L1PreFiringWeight_Nom"
    weight__BtagHFStats1Down: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_down_hfstats1*L1PreFiringWeight_Nom"
    weight__BtagHFStats2Up: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_up_hfstats2*L1PreFiringWeight_Nom"
    weight__BtagHFStats2Down: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_down_hfstats2*L1PreFiringWeight_Nom"
    weight__BtagLFStats1Up: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_up_lfstats1*L1PreFiringWeight_Nom"
    weight__BtagLFStats1Down: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_down_lfstats1*L1PreFiringWeight_Nom"
    weight__BtagLFStats2Up: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_up_lfstats2*L1PreFiringWeight_Nom"
    weight__BtagLFStats2Down: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_down_lfstats2*L1PreFiringWeight_Nom"
    weight__BtagCQErr1Up: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_up_cferr1*L1PreFiringWeight_Nom"
    weight__BtagCQErr1Down: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_down_cferr1*L1PreFiringWeight_Nom"
    weight__BtagCQErr2Up: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_up_cferr2*L1PreFiringWeight_Nom"
    weight__BtagCQErr2Down: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight_btagSF_deepjet_shape_down_cferr2*L1PreFiringWeight_Nom"
    weight__L1PreFiringWeightUp: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*L1PreFiringWeight_Up"
    weight__L1PreFiringWeightDown: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*Electron_RecoSF*Electron_SF*Muon_SF*BtagWeight*L1PreFiringWeight_Dn"

    weight__FakeRateMC: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*FakeElectron_RecoSF*FakeElectron_SF*FakeMuon_SF*BtagWeight*FakeRateWeight*L1PreFiringWeight_Nom"
    weight__FakeRateData: "FakeRateWeight"
    weight__FakeRateUpMC: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*FakeElectron_RecoSF*FakeElectron_SF*FakeMuon_SF*BtagWeight*(FakeRateWeight+FakeRateWeightError)*L1PreFiringWeight_Nom"
    weight__FakeRateDownMC: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*FakeElectron_RecoSF*FakeElectron_SF*FakeMuon_SF*BtagWeight*(FakeRateWeight-FakeRateWeightError)*L1PreFiringWeight_Nom"
    weight__FakeRateUpData: "(FakeRateWeight+FakeRateWeightError)"
    weight__FakeRateDownData: "(FakeRateWeight-FakeRateWeightError)"
    weight__NonFR_AR: "(abs(genWeight)/genWeight)*puWeight*JetPUID_SF*FakeElectron_RecoSF*FakeElectron_SF*FakeMuon_SF*BtagWeight*L1PreFiringWeight_Nom"

steps:

    - name: "BasicSelection"
      cuts: ["CutStep >= 1", "JetVetoSum < 1"]
      hists: [ # "NEvents",
              "W_MT", "MET_pt", "MET_phi",
              "ptsortLepton1_pt", "ptsortLepton2_pt", "ptsortLepton3_pt",
              "ptsortLepton1_eta", "ptsortLepton2_eta", "ptsortLepton3_eta",
              "ptsortGoodJet1_pt", "ptsortGoodJet2_pt", "ptsortGoodJet3_pt",
              "ptsortGoodJet1_eta", "ptsortGoodJet2_eta", "ptsortGoodJet3_eta",
              "nGoodJet", "nBjet"]

    - name: "nBjet1"
      cuts: ["CutStep >= 1", "JetVetoSum < 1", "nBjet >= 1"]
      hists: [ # "NEvents",
              "W_MT", "MET_pt", "MET_phi",
              "ptsortLepton1_pt", "ptsortLepton2_pt", "ptsortLepton3_pt",
              "ptsortLepton1_eta", "ptsortLepton2_eta", "ptsortLepton3_eta",
              "ptsortGoodJet1_pt", "ptsortGoodJet2_pt", "ptsortGoodJet3_pt",
              "ptsortGoodJet1_eta", "ptsortGoodJet2_eta", "ptsortGoodJet3_eta",
              "nGoodJet", "nBjet"]

    - name: "nBjet2"
      cuts: ["CutStep >= 1", "JetVetoSum < 1", "nBjet >= 2"]
      hists: [ # "NEvents",
              "W_MT", "MET_pt", "MET_phi",
              "ptsortLepton1_pt", "ptsortLepton2_pt", "ptsortLepton3_pt",
              "ptsortLepton1_eta", "ptsortLepton2_eta", "ptsortLepton3_eta",
              "ptsortGoodJet1_pt", "ptsortGoodJet2_pt", "ptsortGoodJet3_pt",
              "ptsortGoodJet1_eta", "ptsortGoodJet2_eta", "ptsortGoodJet3_eta",
              "nGoodJet", "nBjet"]

